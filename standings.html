<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<title>Puntesliga Standings</title>
	
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<header>
		<div class="header-images-container">

		</div>
		
		<p>Four Canadians, Six Germans, Ten Owners, One Champion</p>
		
		<nav>
			<a href="index.html">Home</a>
			<a href="matchups.html">Matchups</a>

	<main>

		<section class="standings">

			<h2>Puntesliga Standings</h2>

			<table id="standings-table">

				<thead>

					<tr>
						<th data-column="name">Team</th>
						<th data-column="wins">W</th>
						<th data-column="losses">L</th>
						<th data-column="pf">PF</th>

				<tbody id="standings-body">

				</tbody>
